name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: dist/ matches the build
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"
